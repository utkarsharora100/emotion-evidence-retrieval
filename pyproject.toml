[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reddit-sentiment-rag"
version = "0.1.0"
description = "A lightweight Reddit sentiment GraphRAG pipeline with SPLADE and Qdrant"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.26,<3",
  "networkx>=3.2,<4",
  "qdrant-client>=1.12,<2",
  "sentence-transformers>=3.0,<6",
  "transformers>=4.45,<5",
  "torch>=2.2,<3",
  "langchain-core>=0.3,<2",
  "python-dotenv>=1.0,<2",
  "typer>=0.12,<1",
  "kagglehub>=0.3,<1",
]

[project.scripts]
reddit-rag = "reddit_rag.cli:app"

[project.optional-dependencies]
llm = ["langchain-openai>=0.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]
